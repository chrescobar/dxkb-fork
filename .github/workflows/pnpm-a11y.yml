      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build
        env:
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Set up auth state
        run: playwright test --config playwright.a11y.config.ts --project=a11y-setup-signed-in
        env:
          CI: "true"
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Run deep-tier tests (chromium)
        run: pnpm a11y:deep
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-deep-tier
          path: |
            a11y-report/
